<rect x="0" y="24" width="900" height="6" fill="#0f1930"/>
<rect x="16" y="11" width="8" height="8" fill="#22355e"/>
<rect x="30" y="11" width="8" height="8" fill="#22355e"/>
<rect x="44" y="11" width="8" height="8" fill="#4cc2ff"/>
<text class="mono" x="66" y="20" font-size="13" fill="#7fa3d6" letter-spacing="2">TERMINAL-RADAR ~ MICKAEL</text>
<text class="sig mono" x="860" y="20" font-size="12" fill="#4cc2ff" text-anchor="end" letter-spacing="2">SIGNAL: ONLINE</text>
<g opacity=".08"><rect class="scan" x="0" y="34" width="900" height="6" fill="#4cc2ff"/></g>

<g class="mono" font-size="13" letter-spacing="2">
