<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="Telemetria: Mickael Dias Soares">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a30"/><stop offset="1" stop-color="#050914"/></linearGradient>
</defs>
<style>
.mono{font-family:'Courier New',monospace}
.cur{animation:blink 1s steps(1,end) infinite}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
.sig{animation:sig 1.6s steps(1,end) infinite}
@keyframes sig{0%{opacity:1}50%{opacity:.25}}
.scan{animation:scan 5s steps(20,end) infinite}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(130px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="180" rx="6" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="899" height="179" rx="6" fill="none" stroke="#1d5f99" stroke-width="1"/>
