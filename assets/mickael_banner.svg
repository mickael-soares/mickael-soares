<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Mickael Soares Banner">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#050814"/></linearGradient>
<linearGradient id="txtg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="100%" stop-color="#7dd3fc"/></linearGradient>
</defs>
<style>
.pixel{font-family:'Courier New',monospace;font-weight:900}
.rain{animation:fall 0.8s linear infinite;stroke:#38bdf8;stroke-width:1.5;opacity:0.4}
@keyframes fall{0%{transform:translateY(-50px)}100%{transform:translateY(250px)}}
</style>
<rect width="900" height="240" fill="url(#sky)"/>
<rect x="0.5" y="0.5" width="899" height="239" fill="none" stroke="#1d5f99" stroke-width="1.5"/>

<!-- CHUVA EM PIXEL / LINHAS DE RADAR -->
<g class="rain">
<line x1="80" y1="20" x2="80" y2="45"/>
<line x1="220" y1="60" x2="220" y2="85"/>
<line x1="390" y1="10" x2="390" y2="35"/>
<line x1="560" y1="80" x2="560" y2="105"/>
<line x1="720" y1="30" x2="720" y2="55"/>
<line x1="840" y1="70" x2="840" y2="95"/>
</g>

<!-- CIDADE / HORIZONTE EM PIXEL ART NO FUNDO -->
<path d="M 0 240 L 0 210 L 40 210 L 40 190 L 70 190 L 70 210 L 120 210 L 120 180 L 160 180 L 160 210 L 220 210 L 220 170 L 270 170 L 270 210 L 340 210 L 340 195 L 400 195 L 400 210 L 480 210 L 480 160 L 530 160 L 530 210 L 600 210 L 600 185 L 670 185 L 670 210 L 750 210 L 750 175 L 800 175 L 800 210 L 900 210 L 900 240 Z" fill="#0d1b33" opacity="0.7"/>

<!-- TÍTULO PRINCIPAL EM PIXEL ART -->
<text class="pixel" x="450" y="115" font-size="52" fill="url(#txtg)" text-anchor="middle" letter-spacing="8">MICKAEL_</text>
<text class="pixel" x="450" y="155" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="4">FULLSTACK ENGINEER &#8226; BACKEND &amp; DISTRIBUTED SYSTEMS</text>
<text class="pixel" x="450" y="180" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="3">+10 YEARS IN IT INFRASTRUCTURE &amp; SOFTWARE ARCHITECTURE</text>
</svg>
